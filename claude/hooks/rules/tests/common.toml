expect = "quiet"
input = { tool_input = { command = "pnpm dev", run_in_background = false } }

[[case]]
name = "devserver-build"
rule = "devserver-launch-guard"
expect = "quiet"
input = { tool_input = { command = "pnpm exec vite build", run_in_background = true } }

[[case]]
name = "devserver-test"
rule = "devserver-launch-guard"
