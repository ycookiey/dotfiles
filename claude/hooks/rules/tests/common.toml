[[case]]
name = "hashsum-pipe"
rule = "hashsum-backslash-reminder"
expect = "quiet"
command = "curl -s https://example.com/x | sha256sum"

[[case]]
name = "hashsum-check-flag"
rule = "hashsum-backslash-reminder"
expect = "quiet"
