[[case]]
name = "refresh-interval-edit"
rule = "statusline-refresh-reminder"
expect = "context"
input = { tool_name = "Edit", tool_input = { file_path = "settings.json", old_string = '"command": "claude-statusline"', new_string = '"command": "claude-statusline",\n    "refreshInterval": 1' } }

[[case]]
name = "refresh-interval-write"
rule = "statusline-refresh-reminder"
expect = "context"
input = { tool_name = "Write", tool_input = { file_path = "settings.json", content = '{ "statusLine": { "refreshInterval": 5 } }' } }

[[case]]
name = "other-edit"
rule = "statusline-refresh-reminder"
expect = "quiet"
input = { tool_name = "Edit", tool_input = { file_path = "settings.json", old_string = "a", new_string = "b" } }

[[case]]
name = "config-dir-bash"
rule = "claude-config-dir-guard"
expect = "deny"
