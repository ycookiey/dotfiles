[[case]]
name = "env-prefix-same-var"
rule = "env-prefix-expansion-reminder"
expect = "context"
command = '''TEST_WORKERS=2 pnpm run test --maxWorkers="$TEST_WORKERS"'''

[[case]]
name = "env-prefix-in-quoted-step"
rule = "env-prefix-expansion-reminder"
expect = "context"
command = '''step test "TEST_WORKERS=2 pnpm run test --maxWorkers=\"\$TEST_WORKERS\""'''

[[case]]
name = "env-export-then-use"
rule = "env-prefix-expansion-reminder"
expect = "quiet"
command = '''export TEST_WORKERS=2 && pnpm run test --maxWorkers="$TEST_WORKERS"'''

[[case]]
name = "env-assign-separate-statement"
rule = "env-prefix-expansion-reminder"
expect = "quiet"
command = '''N=3; echo "$N"'''

[[case]]
name = "env-prefix-no-expansion"
rule = "env-prefix-expansion-reminder"
expect = "quiet"
command = '''DEBUG='typescript-eslint:*' node eslint.js packages'''

[[case]]
name = "env-lowercase-assign"
rule = "env-prefix-expansion-reminder"
expect = "quiet"
command = '''out=$(dirname "$0")'''

[[case]]
name = "env-command-substitution-assign"
rule = "env-prefix-expansion-reminder"
expect = "quiet"
command = '''S=$(git log -1 --format=%h "$REF"); echo "$S"'''

[[case]]
name = "env-quoted-value-assign"
rule = "env-prefix-expansion-reminder"
expect = "quiet"
command = '''P='export const x =' && printf '%s' "$P"'''

[[case]]
name = "env-quoted-value-then-semicolon"
rule = "env-prefix-expansion-reminder"
expect = "quiet"
command = '''S="$HOME/x"; ls "$S"'''

[[case]]
name = "timeout-plain"
rule = "timeout-grandchild-reminder"
expect = "context"
command = '''timeout 600 pnpm test'''

[[case]]
name = "timeout-with-option"
rule = "timeout-grandchild-reminder"
expect = "context"
command = '''cd kit && timeout -k 5 300 pnpm run test'''

[[case]]
name = "timeout-option-of-other-tool"
rule = "timeout-grandchild-reminder"
expect = "quiet"
command = '''curl --timeout 5 https://example.com'''

[[case]]
name = "timeout-word-in-text"
rule = "timeout-grandchild-reminder"
expect = "quiet"
command = '''echo "the timeout was hit"'''

[[case]]
name = "sed-i"
rule = "sed-inplace-crlf-reminder"
expect = "context"
command = "sed -i 's/a/b/' x.txt"

[[case]]
name = "sed-e-then-i"
rule = "sed-inplace-crlf-reminder"
expect = "context"
command = "cd x && sed -E -i.bak 's/a/b/' x.txt"

[[case]]
name = "sed-in-place-long"
rule = "sed-inplace-crlf-reminder"
expect = "context"
command = "sed --in-place 's/a/b/' x.txt"

[[case]]
name = "sed-to-stdout"
rule = "sed-inplace-crlf-reminder"
expect = "quiet"
command = "sed -n '1,5p' x.txt"

[[case]]
name = "sed-after-pipe"
rule = "sed-inplace-crlf-reminder"
expect = "quiet"
command = "cat x | sed 's/-i/x/'"

[[case]]
name = "sed-combined-flags"
rule = "sed-inplace-crlf-reminder"
expect = "context"
command = "sed -Ei 's/a+/b/' file.md"

[[case]]
name = "sed-pipe-filter"
rule = "sed-inplace-crlf-reminder"
expect = "quiet"
command = '''git diff | sed 's/\r$//' '''

[[case]]
name = "sed-extended"
rule = "sed-inplace-crlf-reminder"
expect = "quiet"
command = '''sed -E 's/(a)/\1/' file.md'''

[[case]]
name = "sed-no-sed"
rule = "sed-inplace-crlf-reminder"
expect = "quiet"
command = "grep -i sed notes.md"

[[case]]
name = "tmp-node"
rule = "tmp-path-reminder"
expect = "context"
command = '''git show HEAD:a.json > /tmp/a.json && node -e 'require("fs").readFileSync("/tmp/a.json")' '''

[[case]]
name = "tmp-python-heredoc"
rule = "tmp-path-reminder"
expect = "context"
command = '''python - <<'EOF'
print(open('/tmp/x.txt').read())
EOF'''

[[case]]
name = "tmp-bash-only"
rule = "tmp-path-reminder"
expect = "quiet"
command = "cat /tmp/x.log | grep a"

[[case]]
name = "tmp-node-windows-path"
rule = "tmp-path-reminder"
expect = "quiet"
command = "node scripts/build.mjs C:/Users/me/AppData/Local/Temp/x ls node_modules/tmp/"

[[case]]
name = "email-user-agent"
rule = "header-email-reminder"
expect = "context"
