# Cases for the rules in ../common.toml: `yhooky test claude/hooks/rules/tests/common.toml`.

[[case]]
name = "write-text"
rule = "crlf-write-reminder"
expect = "context"
command = '''python - <<'EOF'
Path('a.ts').write_text(s, encoding='utf-8')
EOF'''

[[case]]
name = "open-w-double"
rule = "crlf-write-reminder"
expect = "context"
command = '''python -c 'open("a.txt", "w").write(s)' '''

[[case]]
name = "open-w-single"
rule = "crlf-write-reminder"
expect = "context"
command = '''python - <<'EOF'
with open('a.txt', 'w', encoding='utf-8') as f: f.write(s)
EOF'''

[[case]]
name = "open-append"
rule = "crlf-write-reminder"
expect = "context"
command = '''python - <<'EOF'
open('log.txt', 'a').write(line)
EOF'''

[[case]]
name = "write-bytes"
rule = "crlf-write-reminder"
expect = "quiet"
command = '''python - <<'EOF'
Path('a.ts').write_bytes(s.encode('utf-8'))
EOF'''

[[case]]
name = "open-newline"
rule = "crlf-write-reminder"
expect = "quiet"
command = '''python - <<'EOF'
open('a.txt', 'w', newline='').write(s)
EOF'''

[[case]]
name = "open-read"
rule = "crlf-write-reminder"
expect = "quiet"
command = '''python - <<'EOF'
s = open('a.txt').read()
EOF'''

[[case]]
name = "crlf-unrelated"
rule = "crlf-write-reminder"
expect = "quiet"
command = "git status --short"

[[case]]
name = "set-e"
rule = "set-e-reminder"
expect = "context"
command = "set -euo pipefail; make"

[[case]]
name = "set-o-errexit"
rule = "set-e-reminder"
expect = "context"
command = "set -o errexit\nmake"

[[case]]
name = "set-x-only"
rule = "set-e-reminder"
expect = "quiet"
command = "set -x; make"

[[case]]
name = "reset-e"
rule = "set-e-reminder"
expect = "quiet"
command = "unset -e"

[[case]]
name = "cdragon-bin"
rule = "cdragon-root-record-reminder"
expect = "context"
command = "curl -s https://raw.communitydragon.org/latest/game/data/characters/sru_red/sru_red.bin.json | grep hp | head -1"

[[case]]
name = "cdragon-url"
rule = "cdragon-root-record-reminder"
expect = "context"
input = { tool_name = "WebFetch", tool_input = { url = "https://raw.communitydragon.org/latest/game/data/Characters/SRU_Blue/x.json" } }

[[case]]
name = "cdragon-other-path"
rule = "cdragon-root-record-reminder"
expect = "quiet"
command = "curl -s https://raw.communitydragon.org/latest/plugins/x.json"

[[case]]
name = "python-isolated"
rule = "python-isolated-reminder"
expect = "context"
command = "python -I script.py"

[[case]]
name = "python-isolated-combined"
rule = "python-isolated-reminder"
expect = "context"
command = "cd x && py -EI a.py"

[[case]]
name = "python-ep"
rule = "python-isolated-reminder"
expect = "quiet"
command = "python -E -P script.py"

[[case]]
name = "worktree-remove"
rule = "worktree-remove-reminder"
expect = "context"
command = "git -C /c/repo worktree remove --force /c/x"

[[case]]
name = "worktree-add"
rule = "worktree-remove-reminder"
expect = "quiet"
command = "git worktree add /c/x"

[[case]]
name = "worktree-remove-force"
rule = "worktree-remove-force-guard"
expect = "deny"
command = "git worktree remove --force /c/x"

[[case]]
name = "worktree-remove-f-with-C"
rule = "worktree-remove-force-guard"
expect = "deny"
command = "git -C /c/repo worktree remove -f /c/x"

[[case]]
name = "worktree-remove-no-force"
rule = "worktree-remove-force-guard"
expect = "quiet"
command = "git worktree remove /c/x"

[[case]]
name = "worktree-add-force"
rule = "worktree-remove-force-guard"
expect = "quiet"
command = "git worktree add --force /c/x HEAD"

[[case]]
name = "cmd-slash-c"
rule = "cmd-switch-guard"
expect = "deny"
command = "cmd.exe /c dir"

[[case]]
name = "cmd-double-slash"
rule = "cmd-switch-guard"
expect = "quiet"
command = "cmd //c dir"

[[case]]
name = "cmd-conversion-off"
rule = "cmd-switch-guard"
expect = "quiet"
command = "MSYS2_ARG_CONV_EXCL='*' cmd /c dir"

