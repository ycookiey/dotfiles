[[case]]
name = "settings-home"
rule = "settings-template-reminder"
expect = "context"
input = { tool_name = "Edit", tool_input = { file_path = 'C:\Users\someone\.claude-1\settings.json' } }

[[case]]
name = "settings-project"
rule = "settings-template-reminder"
expect = "quiet"
