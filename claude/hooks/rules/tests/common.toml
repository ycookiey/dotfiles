# Cases for the rules in ../common.toml: `yhooky test claude/hooks/rules/tests/common.toml`.

[[case]]
name = "write-text"
rule = "crlf-write-guard"
expect = "deny"
command = '''python - <<'EOF'
Path('a.ts').write_text(s, encoding='utf-8')
EOF'''

[[case]]
name = "open-w-double"
rule = "crlf-write-guard"
expect = "deny"
command = '''python -c 'open("a.txt", "w").write(s)' '''

[[case]]
name = "open-w-single"
rule = "crlf-write-guard"
expect = "deny"
command = '''python - <<'EOF'
with open('a.txt', 'w', encoding='utf-8') as f: f.write(s)
EOF'''

[[case]]
name = "open-append"
rule = "crlf-write-guard"
expect = "deny"
command = '''python - <<'EOF'
open('log.txt', 'a').write(line)
EOF'''

[[case]]
name = "write-bytes"
rule = "crlf-write-guard"
expect = "quiet"
command = '''python - <<'EOF'
Path('a.ts').write_bytes(s.encode('utf-8'))
EOF'''

[[case]]
name = "open-newline"
rule = "crlf-write-guard"
expect = "quiet"
command = '''python - <<'EOF'
open('a.txt', 'w', newline='').write(s)
EOF'''

[[case]]
name = "open-read"
