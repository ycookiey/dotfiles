# Claude Code hook rules, run by yhooky (github.com/ycookiey/yhooky).
# Each [[rule]] adds a note to Claude's context (action = "context") or
# refuses the tool call (action = "deny") when the fields it reads match:
# every pattern in `all` matches some line, and none in `none` does.
# Patterns are Rust regex, matched one line at a time as grep -E does.
# Literal strings ('...', '''...''') keep backslashes as written.

# Checks a pattern cannot express, built into yhooky (src/builtin).
builtins = [
  "backslash-shrink-guard",
  "rm-junction-guard",
  "askuser-label-guard",
  "sendfile-to-ysidepaney",
  "stage-own-edit-reminder",
  "push-check-reminder",
  "post-push-reminder",
  "head-truncation-reminder",
  "label-guard",
  "language-guard",
  # Records what a turn leaves running, for the your-turn plugin
  # (dotfiles/claude/plugins); resident commands in ../turn-state.toml.
  "turn-state",
]

# The Bash tool runs commands where errexit has no effect, so `set -e`
# does not stop on a failure (`( set -e; false; echo after )` prints after).
[[rule]]
id = "set-e-reminder"
event = "PreToolUse"
tools = '^Bash$'
fields = ["tool_input.command"]
all = ['(^|[^[:alnum:]_-])set[[:space:]]+(-[[:alpha:]]*e|-o[[:space:]]+errexit)']
action = "context"
message = '''Bash ツールでは set -e が効かない(errexit の効かない文脈で実行される。( set -e; false; echo after ) でも after が出る)。失敗で止めたい手順は && でつなぐか、各段の後で終了コードを確かめる。複数の検査を流して最後の結果だけを見ると、途中の失敗を見逃す。'''

# Windows' Python turns \n into \r\n when writing in text mode, so
# replacing an LF file makes every line CRLF (docs/bash.md had it, and it
# was missed). Not for commands that pass `newline=`.
# In a Bash command the text arrives as the command runs, too late to stop
# the rewrite (2026-10-11: two files turned CRLF with the reminder shown), so
# the command is stopped. A script written with the Write tool only gets the
# text: it is read before the script runs, and the content may also be a
# document that merely mentions write_text.
[[rule]]
id = "crlf-write-guard"
event = "PreToolUse"
tools = '^Bash$'
fields = ["tool_input.command"]
all = ['''write_text\(|open\([^)]*["'](w|a|x)[t+]?["']''']
none = ['newline=']
action = "deny"
message = '''Windows の Python は text mode の書き込み(Path.write_text / open(p, "w"))で \n を \r\n に変える。LF のファイルを書き換えると全行が CRLF になる。read_bytes().decode() → write_bytes(s.encode())、または open(p, "w", newline="") を使う(CRLF で書きたいなら newline="\r\n" と明示すれば通る)。書いた後は file <path> か git ls-files --eol <path> で確かめる(docs/bash.md)。'''

[[rule]]
id = "crlf-write-reminder"
event = "PreToolUse"
tools = '^Write$'
fields = ["tool_input.content"]
all = ['''write_text\(|open\([^)]*["'](w|a|x)[t+]?["']''']
none = ['newline=']
action = "context"
message = '''Windows の Python は text mode の書き込み(Path.write_text / open(p, "w"))で \n を \r\n に変える。LF のファイルを書き換えると全行が CRLF になる。read_bytes().decode() → write_bytes(s.encode())、または open(p, "w", newline="") を使う。書いた後は file <path> か git ls-files --eol <path> で確かめる(docs/bash.md)。'''

# Get-WinUserLanguageList writes its list as one object: piped straight on
# or looped over directly, the whole list is one item and filtering by
# language matches nothing or everything (2026-10-11: hit twice in one
# session). Wrapping it in parentheses or a variable enumerates it.
[[rule]]
id = "winuserlanguagelist-reminder"
event = "PreToolUse"
tools = '^(Bash|PowerShell|Write)$'
fields = ["tool_input.command", "tool_input.content"]
all = ['''(^|[^($[:alnum:]-])Get-WinUserLanguageList[[:space:]]*\||in[[:space:]]+Get-WinUserLanguageList[[:space:]]*\)''']
action = "context"
message = '''Get-WinUserLanguageList は一覧を 1 つのまとまりとして出す。直接パイプに流す(Get-WinUserLanguageList | ? {...})・foreach ($x in Get-WinUserLanguageList) では、一覧全体が 1 つの項目になり、言語ごとに選べない。(Get-WinUserLanguageList) | ... と括弧で包むか、$l = Get-WinUserLanguageList としてから foreach ($x in $l) / $l.Where({...}) を使う。'''

# A CommunityDragon character bin holds several CharacterRecords with
# different values; `grep | head -1` reads one that is not Root
# (docs/league-game-data.md had it, and it was missed).
[[rule]]
id = "cdragon-root-record-reminder"
event = "PreToolUse"
tools = '^(Bash|WebFetch)$'
fields = ["tool_input.command", "tool_input.url"]
all = ['communitydragon', '(?i)/characters/']
action = "context"
message = '''CommunityDragon の character bin は CharacterRecord を複数持ち、record ごとに値が違う (例: sru_red の Root 2300 / 別 record 5000、sru_blue の Root 2300 / 3750)。SR の値は key `Characters/<Name>/CharacterRecords/Root` の record から読む。grep -o ... | head -1 で先頭を拾わない (docs/league-game-data.md)。'''

# `python -I` also turns off the user site (pip --user), so what is
# installed there cannot be imported; `python -E -P` keeps it (docs/bash.md).
[[rule]]
id = "python-isolated-reminder"
event = "PreToolUse"
tools = '^Bash$'
fields = ["tool_input.command"]
all = ['(^|[[:space:];&|(/])(python[0-9.]*|py)(\.exe)?[[:space:]]+(-[A-Za-z]+[[:space:]]+)*-[A-Za-z]*I']
action = "context"
message = '''python -I は user site (pip --user、AppData/Roaming/Python) も無効にするので、そこに入れた numpy 等が import できない。目的がスクリプトのフォルダや cwd を sys.path に入れないことなら python -E -P (3.11+) で足り、user site は残る (docs/bash.md)。'''

# Windows + pnpm: `git worktree remove` fails on the junctions in
# node_modules, and rm -rf can follow them.
[[rule]]
id = "worktree-remove-reminder"
event = "PreToolUse"
tools = '^Bash$'
fields = ["tool_input.command"]
all = ['(^|[^[:alnum:]_-])git([[:space:]]+-[^[:space:]]+([[:space:]]+[^-[:space:]][^[:space:]]*)?)*[[:space:]]+worktree[[:space:]]+remove([[:space:]]|$)']
action = "context"
message = '''worktree の後片付け: pnpm の node_modules(junction)があると git worktree remove は "Directory not empty" で失敗するが、登録は外れる。残ったフォルダは cmd //c "rmdir /s /q C:\path" で消す(junction はリンクだけ消し、先をたどらない)。rm -rf は junction の扱いが環境依存で、link: 依存の先(兄弟の checkout 等)を消しうるので使わない。詳細 ~/.claude/docs/git.md の「部分 stage の単独検証と worktree の後片付け」'''

# `git worktree remove --force` can follow a junction inside the worktree
# (e.g. node_modules linked to the main checkout) and delete what it points
# at: it once emptied 142 packages and .bin of the main node_modules.
[[rule]]
id = "worktree-remove-force-guard"
event = "PreToolUse"
tools = '^Bash$'
fields = ["tool_input.command"]
all = [
  '(^|[^[:alnum:]_-])git([[:space:]]+-[^[:space:]]+([[:space:]]+[^-[:space:]][^[:space:]]*)?)*[[:space:]]+worktree[[:space:]]+remove([[:space:]]|$)',
  '[[:space:]](--force|-f)([[:space:]]|$)',
]
action = "deny"
message = '''git worktree remove --force は、worktree の中の junction (つないだ node_modules 等) をたどって、つないだ先 (本体の node_modules など) の中身まで消すことがある (実例: 本体の node_modules から 142 パッケージと .bin が消えた)。先に junction をリンクだけ外す (PowerShell: (Get-Item <worktree>\node_modules -Force).Delete()、または cmd //c rmdir <worktree>\node_modules)。その後 --force なしで git worktree remove を実行し、消えない残骸は cmd //c "rmdir /s /q C:\path" で消す (~/.claude/docs/git.md の「部分 stage の単独検証と worktree の後片付け」)。'''

# Agent with isolation: "worktree" (forks / subagents in their own worktree).
# Seen with 4 parallel forks: every worktree branched from the repo's first
# commit instead of HEAD; the forks fought over the one Claude in Chrome;
# edits to the same file (and a change of draw order) collided on merge.
[[rule]]
id = "agent-worktree-reminder"
event = "PreToolUse"
tools = '^Agent$'
fields = ["tool_input.isolation"]
all = ['^worktree$']
action = "context"
message = '''isolation: worktree の agent に渡す prompt に入れる: (1) worktree が今の HEAD でなく古い commit (実例: repo の最初の commit) から作られることがある。今の HEAD の hash を書き、作業前に git log -1 で確かめて違えば git reset --hard <hash> させる (2) 並列で画面を確かめるなら、Claude in Chrome は 1 つを取り合ってタブの組が消え・スクリーンショットが時間切れになるので、headless の Playwright (skill ui-visual-check の scripts/node_modules) を使わせる (3) 並列の agent が同じファイルを触るなら、処理は新しいファイルに分け、元のファイルの変更は呼び出しの差し替えだけにさせる。処理の順序を変える変更 (描画の順など) は 1 つの agent にまとめる (取り込みで大きく衝突する)。node_modules は worktree に無いので junction で足し、後片付けは junction を先に外す (worktree-remove の規則)。'''

# Git Bash turns a lone `/c` into `C:/`, so `cmd.exe /c ...` opens cmd's
# interactive screen and waits.
[[rule]]
id = "cmd-switch-guard"
event = "PreToolUse"
tools = '^Bash$'
fields = ["tool_input.command"]
all = ['(^|[^[:alnum:]_./-])cmd([.]exe)?[[:space:]]+/[[:alpha:]]([[:space:]]|$)']
none = ['MSYS2_ARG_CONV_EXCL', 'MSYS_NO_PATHCONV']
group = "msys-switch"
action = "deny"
message = '''Git Bash は cmd の /c を C:/ に変えるので、cmd が対話の画面で起動して止まる。cmd.exe //c ... と書くか、MSYS2_ARG_CONV_EXCL='*' を付ける(ファイルを既定のアプリで開くなら PowerShell の Start-Process、フォルダなら explorer.exe も可)。詳細 ~/.claude/docs/bash.md の「MSYS パス変換」'''

# Git Bash also rewrites a `/Switch` argument given to any native program:
# `/ErrorStdOut` reaches AutoHotkey as `C:/.../git/<ver>/ErrorStdOut`, which
# it opens as the script and shows a "Script file not found" dialog on the
# user's desktop. Checks the unquoted arguments of a `.exe` command up to the
# first quoted one, and a `$VAR` in command position followed directly by a
# switch. Quoted switches are left out: in past commands they were mostly
# text inside another program's code (`pwsh -c "... '/u' ..."`, printf),
# not arguments. MSYS leaves `//X` and `/X:...` alone.
[[rule]]
id = "exe-switch-guard"
event = "PreToolUse"
tools = '^Bash$'
fields = ["tool_input.command"]
all = ['(?i)([.]exe[\x22\x27]?([[:space:]]+[^;&|<>[:space:]\x22\x27]+)*|(^|[;&|(]|(^|[[:space:]])(do|then|timeout([[:space:]]+-[^[:space:]]+)*[[:space:]]+[0-9.]+[smhd]?))[[:space:]]*\x22?[$][{]?[[:alnum:]_]+[}]?\x22?)[[:space:]]+/[[:alpha:]][^/:;&|[:space:]\x22\x27]*([[:space:];&|)]|$)']
none = ['MSYS2_ARG_CONV_EXCL', 'MSYS_NO_PATHCONV']
group = "msys-switch"
action = "deny"
message = '''Git Bash は Windows のプログラムに渡す /Switch 形式の引数を、パスに変える(例: AutoHotkey64.exe /ErrorStdOut は C:/.../git/<版>/ErrorStdOut になり、AutoHotkey がそれをスクリプトとして開こうとして、ユーザーの画面に「Script file not found」のダイアログを出す。/S は S:/ になる)。//ErrorStdOut のように / を重ねるか、MSYS2_ARG_CONV_EXCL='*' か MSYS_NO_PATHCONV=1 を付ける(このときは引数のパスを Windows 形式で渡す)。PowerShell の tool から呼んでもよい。詳細 ~/.claude/docs/bash.md の「MSYS パス変換」'''

# A dev server started in the background from Git Bash loses its Windows
# parent at npm's shim, so TaskStop leaves node and workerd holding the
# port; from the PowerShell tool it stops cleanly.
[[rule]]
id = "devserver-launch-guard"
event = "PreToolUse"
tools = '^Bash$'
fields = ["tool_input.command"]
equals = { "tool_input.run_in_background" = "true" }
all = ['(^|[;&|(`[:space:]])(pnpm|npm|yarn|bun)([[:space:]]+(run|exec|-[^[:space:]]+([[:space:]]+[^-;&|[:space:]][^;&|[:space:]]*)?))*[[:space:]]+(dev|start|serve|preview|storybook)([[:space:];&|)]|$)|(^|[;&|(`[:space:]])(npx[[:space:]]+)?(vite([[:space:]]+(dev|serve|preview)([[:space:];&|)]|$)|[[:space:]]+-|[[:space:]]*([;&|)]|$))|(wrangler[[:space:]]+dev|next[[:space:]]+(dev|start)|storybook[[:space:]]+dev)([[:space:];&|)]|$))']
action = "deny"
message = '''常駐の dev server は Bash ではなく PowerShell の tool の run_in_background で起動する(例: Set-Location C:/path/app; pnpm dev --port 5190 --strictPort *> <log>)。Git Bash から起動すると npm の shim の所で親子のつながりが切れ、TaskStop の後も node・workerd が残って port を掴む。詳細 ~/.claude/docs/bash.md の「dev server は PowerShell の tool で起動する」'''

# ~/.claude*/settings.json is merged from the dotfiles template.
[[rule]]
id = "settings-template-reminder"
event = "PreToolUse"
tools = '^(Read|Edit|Write)$'
fields = ["tool_input.file_path"]
all = ['[\\/](Users|home)[\\/][^\\/]+[\\/]\.claude(-[^\\/]+)?[\\/]settings\.json$']
action = "context"
message = '''~/.claude*/settings.json は dotfiles/claude/settings.json をテンプレートとするマージ先。nushell/pwsh 起動ごとの dotcli sync がテンプレートのキー(model・hooks 等)を上書きし、テンプレートにないキーは残す(消さない)。テンプレートにあるキーを変える・全端末に効かせる変更はテンプレート側も編集する。手元や /model だけの変更は次の sync で戻る。詳細 ~/.claude/docs/symlinks.md'''

# `X=1 cmd "$X"`: the assignment applies to cmd's environment, but the
# shell expands $X before it, so cmd gets the old (often empty) value.
# Rust regex has no backreference, so any uppercase expansion on such a
# line matches. The value is kept to plain words: `S=$(cmd "$X"); next`
# is an ordinary assignment, not a prefix.
[[rule]]
id = "env-prefix-expansion-reminder"
event = "PreToolUse"
tools = '^Bash$'
fields = ["tool_input.command"]
all = ['''(^|[;&|(`"'[:space:]])[A-Z_][A-Z0-9_]*=[^;&|$"'()`[:space:]]*[[:space:]]+[^;&|#]*\$\{?[A-Z_][A-Z0-9_]*''']
action = "context"
message = '''X=1 cmd "$X" の形では、行頭の代入は cmd の環境変数にだけ効き、同じ行の $X は代入の前の値(多くは空)で展開される。実測: TEST_WORKERS=2 pnpm run test --maxWorkers="$TEST_WORKERS" で vitest に --maxWorkers= が空で渡り落ちた。先に export X=1 するか、別の行で設定する。名前の一致までは見ていないので、別の変数なら問題ない。'''

# Git Bash's `timeout` stops only its direct child; on Windows the
# grandchildren (vitest workers, workerd, browsers) keep running.
[[rule]]
id = "timeout-grandchild-reminder"
event = "PreToolUse"
tools = '^Bash$'
fields = ["tool_input.command"]
all = ['(^|[;&|(`[:space:]])timeout[[:space:]]+(-[^[:space:]]+[[:space:]]+)*[0-9]']
action = "context"
message = '''Git Bash の timeout は時間切れで直接の子だけを止め、孫(vitest の worker・workerd・ブラウザ等)は動き続ける。長い処理は run_in_background で起動し、終わったら tasklist で残りを確かめ、自分が起動したものが残っていれば taskkill /PID <pid> /T /F で止める(詳細 ~/.claude/docs/bash.md の「dev server は PowerShell の tool で起動する」)。'''

# Git Bash's `sed -i` turns a CRLF file into LF on every line, changed or
# not (docs/bash.md had it, and it was missed).
[[rule]]
id = "sed-inplace-crlf-reminder"
event = "PreToolUse"
tools = '^Bash$'
fields = ["tool_input.command"]
all = ['(^|[[:space:];&|(])sed[[:space:]]+([^|;&]*[[:space:]])?(-[A-Za-z]*i|--in-place)']
action = "context"
message = '''Git Bash の sed -i は CRLF のファイルを全行 LF にする(置換していない行も)。CRLF のファイルは Edit ツールで直すか、python で bytes のまま置換する。sed -i を使ったら unix2dos -q <file> で戻し、file <file> の「with CRLF line terminators」で確かめる(docs/bash.md)。'''

# Windows' node and python read /tmp as C:\tmp, while Git Bash's /tmp is
# %TEMP%: a file written to /tmp by bash is not found by node -e
# (docs/bash.md had it, and it was missed twice).
[[rule]]
id = "tmp-path-reminder"
event = "PreToolUse"
tools = '^Bash$'
fields = ["tool_input.command"]
all = ['''(^|[;&|(`"'[:space:]])(node|python[0-9.]*|py)(\.exe)?([[:space:]]|$)''', '''(^|[[:space:]"'=(])/tmp/''']
action = "context"
message = '''Windows の node・python は /tmp を C:\tmp と読む(Git Bash の /tmp は %TEMP%、C:\Users\<user>\AppData\Local\Temp)。bash で /tmp に書いたファイルは node・python から見えない。受け渡しのパスは scratchpad などの C:/... の形で書く(docs/bash.md)。'''

# An API that asks for a contact in the User-Agent invites putting the
# user's e-mail address in it; it was sent that way once. Only when the
# user asks.
[[rule]]
id = "header-email-reminder"
event = "PreToolUse"
tools = '^Bash$'
fields = ["tool_input.command"]
all = ['(^|[;&|(`[:space:]])(curl|wget)([[:space:]]|$)', '''(-A|-H|-U|--user-agent|--header)[[:space:]=]*(['"][^'"]*|[^[:space:]'"]*)[[:alnum:]._%+-]+@[[:alnum:]-]+\.[[:alpha:]]''']
action = "context"
message = '''外部のサービスへ送る header(User-Agent 等)にメールアドレスが入っている。ユーザーのアドレスなら、ユーザーが頼んだときだけ入れる。連絡先を求める API には、ツールの repo の URL などを使う。'''

# statusLine.refreshInterval was dropped in 2026-06 (dotfiles bfc2621): run
# every second in each of 9 sessions, up to 90 claude-statusline processes
# were alive at once and left-behind ones piled up. It was proposed again
# without knowing that.
[[rule]]
id = "statusline-refresh-reminder"
event = "PreToolUse"
tools = '^(Edit|Write)$'
fields = ["tool_input.new_string", "tool_input.content"]
all = ['refreshInterval']
action = "context"
message = '''statusLine の refreshInterval は 2026-06 に外した(dotfiles bfc2621)。1 秒ごとだと 9 セッションで最大 90 個の claude-statusline が同時に動き、終わらずに残るものが積み上がった(~/.claude/docs/hooks.md の「罠」)。待たずに出したい表示は、plugin の $.ui.status など、プロセスを起動しない方法を先に検討する。'''

# Running the claude CLI with CLAUDE_CONFIG_DIR set to ~/.claude itself (the
# folder the accounts ~/.claude-* mirror) created ~/.claude/.claude.json,
# which the mirroring could then link into every account.
[[rule]]
id = "claude-config-dir-guard"
event = "PreToolUse"
tools = '^(Bash|PowerShell)$'
fields = ["tool_input.command"]
all = ['''CLAUDE_CONFIG_DIR['"]?[[:space:]]*=[[:space:]]*['"]?[^'";[:space:]]*[/\\]\.claude[/\\]?(['";[:space:]]|$)''']
action = "deny"
message = '''CLAUDE_CONFIG_DIR を実体の ~/.claude に向けて claude CLI を動かすと、使われていない ~/.claude/.claude.json が作られ、~/.claude-* へのミラーの対象になりうる(~/.claude/docs/symlinks.md の「マルチアカウント」)。user settings を書く CLI(plugin install・marketplace add 等)は普段のアカウント(~/.claude-N)で動かし、後で ls -la ~/.claude-*/settings.json でリンクが残っているかを確かめる。'''

# With a file name containing '\' (any Windows path), coreutils' *sum print
# a leading '\' before the hash. A script comparing the hash as a string then
# fails although the file is fine (a download check failed this way).
[[rule]]
id = "hashsum-backslash-reminder"
event = "PreToolUse"
tools = '^Bash$'
fields = ["tool_input.command"]
all = ['''(^|[;&|(`$[:space:]])(sha256sum|sha1sum|md5sum|sha512sum)[[:space:]]+[^<|[:space:]-]''']
action = "context"
message = '''sha256sum などは、ファイル名に \ を含む(Windows のパス)と出力の先頭に \ を付ける。ハッシュを文字列で比べると、中身が合っていても食い違う。比べるなら sha256sum < "$f" | cut -d' ' -f1 のように標準入力で渡す。表示するだけなら気にしなくてよい。'''

# Staging only one's own lines by hand (hash-object + update-index from a
# script) skips the stage-own-edit-reminder, which watches Edit and Write,
# and a script that rewrites the file can lose the other sessions' edits
# (a plan.md with another session's changes was emptied this way).
[[rule]]
id = "own-edit-staging-reminder"
event = "PreToolUse"
tools = '^(Bash|Write)$'
fields = ["tool_input.command", "tool_input.content"]
all = ['''update-index[[:space:]]+--cacheinfo|hash-object[[:space:]]+(-[^[:space:]]+[[:space:]]+)*-w|"update-index",[[:space:]]*"--cacheinfo"|"hash-object",[[:space:]]*"-w"''']
action = "context"
message = '''他の session の未コミットの変更がある file で自分の行だけを stage するなら、git stage-own-edit begin <file> → Edit ツールで編集 → git stage-own-edit stage <file> を使う(~/.claude/docs/git.md の「他人の未コミットの変更がある file で、自分の編集だけを stage する」)。hash-object・update-index を組む script で file を書き換えると、途中で止まったときに他の session の変更ごと消えうる。'''

# open(p, "w") empties the file before the value passed to write() is built,
# so an exception there leaves it empty.
[[rule]]
id = "truncating-write-reminder"
event = "PreToolUse"
tools = '^(Bash|Write)$'
fields = ["tool_input.command", "tool_input.content"]
all = ['''open\([^)]*["']w[bt+]?["'][^)]*\)\.write\(''']
action = "context"
message = '''open(p, "w"/"wb") は開いた時点で file を空にする。open(...).write(f(x)) の f(x) が例外で止まると、中身が消えたまま残る。中身を先に作り終え、一時 file に書いてから os.replace で置き換える。既存の file の一部を直すだけなら Edit ツールを使う。'''

# Git Bash's find started at / or a drive root walks the whole drive for
# tens of minutes, and keeps a core busy after the Bash tool gives up on it
# (2026-10-11: three sessions each left one running for hours).
[[rule]]
id = "find-root-guard"
event = "PreToolUse"
tools = '^Bash$'
fields = ["tool_input.command"]
all = ['''(^|[;&|(`[:space:]])find([[:space:]]+-[HLP])*[[:space:]]+["']?(/|/[[:alpha:]]/?|/mnt/[[:alpha:]]/?|[[:alpha:]]:[/\\]?)["']?([[:space:];&|)]|$)''']
action = "deny"
message = '''Git Bash の find を / やドライブのルート(/c・C:/・/mnt/c)から始めると、ドライブ全体をたどって何十分も終わらない。Bash ツールが時間切れで諦めた後も裏で残り、1 コアを使い続ける(親のない find は bin/reap-orphans.ps1 が後で止める)。名前で探すなら fd を使う(例: fd -HI -g 'base.json' ~、ディレクトリは -t d)。find を使うなら、心当たりのある場所から始める。'''

# Text typed into web forms or sent as messages goes out as written: the
# spacing and bracket rules in docs/external-japanese.md were known and
# still missed when filling a form.
[[rule]]
id = "ja-ascii-space-reminder"
event = "PreToolUse"
tools = '^(mcp__claude-in-chrome__(form_input|computer|javascript_tool)|mcp__beeper__send_message)$'
fields = ["tool_input.value", "tool_input.text"]
all = ['[\p{Hiragana}\p{Katakana}\p{Han}] [A-Za-z0-9]|[A-Za-z0-9] [\p{Hiragana}\p{Katakana}\p{Han}]']
action = "context"
message = '''外に出る文(フォームへの入力・送るメッセージ)は、日本語と英数字の間にスペースを入れない(AI時代、2人、5つ)。docs/external-japanese.md'''

[[rule]]
id = "ja-kagi-overuse-reminder"
event = "PreToolUse"
tools = '^(mcp__claude-in-chrome__(form_input|computer|javascript_tool)|mcp__beeper__send_message)$'
fields = ["tool_input.value", "tool_input.text"]
all = ['「[^」]*」.*「[^」]*」.*「']
action = "context"
message = '''外に出る文のカギかっこは、画面の表記と発言の引用だけに使う。強調や用語の囲みに使わない(docs/external-japanese.md)。'''
